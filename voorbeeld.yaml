toets:
  opgaven:
    - titel: "Inhaalwerk"
      needspace_cm: 8
      delen:
        - tekst: "Herleid."
          onderdelen:
            - punten: 2
              mode: "math"
              inhoud: "(a + b)^2 (3a + 2b) - 4(3a + 2b)(3a - 2b)"
            - punten: 2
              verlenger: true
              mode: "math"
              inhoud: "\\left(-x^2 + x\\right)^3"
        - tekst: "Los op"
          onderdelen:
            - punten: 2
              mode: "math"
              inhoud: "5 = \\frac{q^2 - q - 6}{q^2 - 4}"
        - tekst: "Bepaal de snijpunten van beide functies."
          onderdelen:
            - mode: "latex"
              grafiek: |
                \begin{center}
                \begin{tikzpicture}
                  \begin{axis}[
                    axis lines=middle,
                    xmin=-5, xmax=5,
                    ymin=-5, ymax=5,
                    grid=both,
                    width=8cm,
                    height=8cm
                  ]
                    \addplot[domain=-5:5, samples=200] {x^2};
                    \addplot[domain=-5:5, samples=200] {2*x};
                  \end{axis}
                \end{tikzpicture}
                \end{center}
            - punten: 4
              inhoud: "Lees de snijpunten af."