toets:
  opgaven:
    - titel: "Inhaalwerk Opgave 1"
      inleiding: "Herleid."
      onderdelen:
        - punten: 2
          mode: "latex"
          inhoud: "\\[
            \\begin{aligned}
              &(a + b)^2 (3a + 2b) - 4(3a + 2b)(3a - 2b) \\
              &= (3a + 2b)\left[(a + b)^2 - 4(3a - 2b)\right] \\
              &= (3a + 2b)\left[a^2 + 2ab + b^2 - 12a + 8b\right] \\
              &= (3a + 2b)(a^2 + 2ab + b^2 - 12a + 8b)
            \\end{aligned}
          \\]"
        - punten: 2
          verlenger: true
          mode: "latex"
          inhoud: "\\[
            (-x^2 + x)^3 = -(x(x-1))^3 = - (x^3)(x-1)^3 \\
            = -x^3(x^2 - 2x + 1)
          \\]"
        - punten: 2
          mode: "latex"
          inhoud: "\\[
              B = \\frac{q^2 - q - 6}{q^2 - 4}
                = \\frac{(q+2)(q-3)}{(q+2)(q-2)}
                = \\frac{q-3}{q-2} \quad (q \neq -2)
            \\]"
        - punten: 2
          verlenger: true
          mode: "latex"
          inhoud: "\\[
              \\frac{1}{5}c + \\frac{b}{c} \\cdot \\frac{3c}{8}
                = \\frac{1}{5}c + \\frac{3b}{8}
            \\]"
        - punten: 2
          mode: "latex"
          inhoud: "\\[
              \\begin{aligned}
                &\\frac{7}{y-4} - \\frac{y+4}{y-2} \\
                &= \\frac{7(y-2) - (y+4)(y-4)}{(y-4)(y-2)} \\
                &= \\frac{7y - 14 - y^2 + 16}{(y-4)(y-2)} \\
                &= \\frac{-y^2 + 7y + 2}{(y-4)(y-2)}
              \\end{aligned}
          \\]"
        - punten: 2
          mode: "latex"
          inhoud: "\\[
              \\begin{aligned}
                &\\frac{5r^2}{r + 6} : \\frac{r}{3r + 18} \\
                &= \\frac{5r^2}{r+6} \cdot \\frac{3(r+6)}{r} \\
                &= \\frac{5r^2 \cdot 3(r+6)}{(r+6)r} \\
                &= \\frac{15r^2}{r^2 + 6r}
              \\end{aligned}
          \\]"
        - punten: 2
          mode: "latex"
          inhoud: "\\[
              \\begin{aligned}
                 &4\\sqrt{45} - \\sqrt{2} \cdot \\sqrt{32} \\
                &= 4\sqrt{9 \cdot 5} - \sqrt{64} \\
                &= 12\sqrt{5} - 8
              \\]
          \\]"
        - punten: 2
          mode: "latex"
          inhoud: "\\[
              \\begin{aligned}
                 & (2\\sqrt{7} - 3\\sqrt{2})^2 \\
                &= (2\sqrt{7})^2 - 2 \cdot 2\sqrt{7} \cdot 3\sqrt{2} + (3\sqrt{2})^2 \\
                &= 4 \cdot 7 - 12\sqrt{14} + 9 \cdot 2 \\
                &= 28 - 12\sqrt{14} + 18 \\
                &= 46 - 12\sqrt{14}
              \\]
          \\]"
        - punten: 4
          mode: "latex"
          inhoud: "\\[
            \\begin{aligned}
              &\\frac{6\\sqrt{80}}{4\\sqrt{5}} 
                = \\frac{6 \cdot 4\sqrt{5}}{4\sqrt{5}} = 6 \\
              &+ \\sqrt{\\frac{25}{16}} = \\frac{5}{4} \\
              &+ \\sqrt{4.25}
                = \\sqrt{\frac{17}{4}} = \\frac{\sqrt{17}}{2}
            \\]
          \\]"