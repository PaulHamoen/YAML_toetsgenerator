toets:
  opgaven:
    - titel: "Grafiek als laatste onderdeel"
      needspace_cm: 8
      delen:
        - tekst: "Bekijk de volgende grafiek."
          onderdelen:
            - mode: "latex"
              grafiek: |
                \begin{tikzpicture}
                  \draw (0,0) -- (1,1);
                \end{tikzpicture}


toets:
  opgaven:
    - titel: "Ongeldige wiskundige inhoud"
      needspace_cm: 8
      delen:
        - tekst: "Herleid."
          onderdelen:
            - punten: 2
              mode: "math"
              inhoud: "x^2 + = 5"


# van llama3.1:latest

toets:
  opgaven:
    - titel: "Vergelijken van kwadratische vergelijkingen"
      needspace_cm: 5
      delen:
        - tekst: "Wat is de juiste stap om aan te tonen dat (x + 2)^2 = x^2 + 4x + 4 niet dezelfde waarde heeft als 0?"
          onderdelen:
            - mode: "latex"
              grafiek: |
                \begin{tikzpicture}
                  \draw (0,0) -- (1,1);
                \end{tikzpicture}
            - punten: 3
              mode: "math"
              inhoud: "(x + 2)^2 - (x^2 + 4x + 4) = ?"


